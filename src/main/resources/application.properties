spring.application.name=taskflow

# Database — values come from environment variables in production (Railway).
# The part after the ":" is a fallback for local development only.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT — the secret MUST be overridden via the JWT_SECRET env var in production.
jwt.secret=${JWT_SECRET:local-dev-only-secret-key-never-use-in-production-1234}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Seeded admin account — override ADMIN_PASSWORD in production.
admin.password=${ADMIN_PASSWORD:admin123}

# Server — Railway injects PORT at runtime
server.port=${PORT:8080}
