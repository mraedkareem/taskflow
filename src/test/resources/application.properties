spring.application.name=taskflow

# Tests use H2, an in-memory database: starts with the test, gone after.
# MODE=PostgreSQL makes H2 imitate PostgreSQL's behavior.
spring.datasource.url=jdbc:h2:mem:taskflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# create-drop: build all tables fresh, drop them when tests finish
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT (test values only)
jwt.secret=test-secret-key-only-used-during-automated-tests-12345
jwt.expiration-ms=86400000

# Seeded admin account (test value only)
admin.password=test-admin-password
